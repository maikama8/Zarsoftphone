<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple phone icon for tray - monochrome black -->
  <g>
    <!-- Phone body outline -->
    <rect x="20" y="8" width="24" height="48" rx="3" stroke="black" stroke-width="2.5" fill="none"/>
    
    <!-- Screen area -->
    <rect x="23" y="14" width="18" height="32" rx="1.5" fill="black"/>
    
    <!-- Signal waves (left) -->
    <path d="M 28 24 Q 25 28 28 32" stroke="black" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 26 22 Q 22 28 26 34" stroke="black" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    
    <!-- Signal waves (right) -->
    <path d="M 36 24 Q 39 28 36 32" stroke="black" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 38 22 Q 42 28 38 34" stroke="black" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    
    <!-- Home button -->
    <circle cx="32" cy="51" r="2.5" fill="black"/>
  </g>
</svg>
