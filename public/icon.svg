<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Zarsip app icon — bold "Z" fused with a call/signal motif -->
  <defs>
    <!-- Brand blue gradient (matches in-app accent) -->
    <linearGradient id="zBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0051D5"/>
    </linearGradient>

    <!-- Top shine -->
    <linearGradient id="zShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle white gradient for the mark -->
    <linearGradient id="zMark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#EAF3FF"/>
    </linearGradient>

    <!-- Drop shadow for the mark -->
    <filter id="zShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for the signal waves -->
    <filter id="zGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-square background (macOS style) -->
  <rect width="1024" height="1024" rx="226.67" fill="url(#zBg)"/>
  <rect width="1024" height="540" rx="226.67" fill="url(#zShine)"/>

  <g filter="url(#zShadow)">
    <!-- Signal / call waves radiating from the top-right of the Z -->
    <g fill="none" stroke="url(#zMark)" stroke-linecap="round" filter="url(#zGlow)">
      <path d="M 792 318 Q 846 356 792 394" stroke-width="24" opacity="0.95"/>
      <path d="M 824 286 Q 906 356 824 426" stroke-width="22" opacity="0.55"/>
    </g>

    <!-- Bold Z drawn as a single stroke (round caps read like handset ends) -->
    <polyline points="312,356 712,356 312,668 712,668"
              fill="none"
              stroke="url(#zMark)"
              stroke-width="118"
              stroke-linecap="round"
              stroke-linejoin="round"/>

    <!-- Call-node accent on the lower-left terminal -->
    <circle cx="312" cy="668" r="30" fill="#0A84FF"/>
    <circle cx="312" cy="668" r="15" fill="#ffffff"/>
  </g>

  <!-- Subtle grounding shadow -->
  <ellipse cx="512" cy="946" rx="330" ry="26" fill="black" opacity="0.07"/>
</svg>
